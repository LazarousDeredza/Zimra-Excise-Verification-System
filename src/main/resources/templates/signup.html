<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Create Account</title>

  <style>

    body {
        font-family: Arial, sans-serif;
        background: #f4f6f8;

        display: flex;
        justify-content: center;
        align-items: center;

        min-height: 100vh;
    }

    .signup-container {

        width: 400px;

        background: white;

        padding: 30px;

        border-radius: 10px;

        box-shadow:
            0 5px 20px rgba(0,0,0,0.1);
    }

    h2 {
        text-align: center;
        margin-bottom: 25px;
    }

    .form-group {
        margin-bottom: 15px;
    }

    label {
        display: block;
        margin-bottom: 5px;
    }

    input {

        width: 100%;

        padding: 12px;

        box-sizing: border-box;
    }

    button {

        width: 100%;

        padding: 12px;

        background: #198754;

        color: white;

        border: none;

        border-radius: 5px;

        cursor: pointer;
    }

    .login {
        text-align: center;
        margin-top: 20px;
    }

  </style>

</head>

<body>

<div class="signup-container">

  <h2>Create Account</h2>


  <form
          method="POST"
          action="/register">


    <div class="form-group">

      <label>Name</label>

      <input
              type="text"
              name="name"
              placeholder="Enter your name"
              required>

    </div>


    <div class="form-group">

      <label>Email</label>

      <input
              type="email"
              name="email"
              placeholder="Enter your email"
              required>

    </div>


    <div class="form-group">

      <label>Password</label>

      <input
              type="password"
              name="password"
              placeholder="Enter password"
              minlength="6"
              required>

    </div>


    <button type="submit">

      Create Account

    </button>

  </form>


  <div class="login">

    Already have an account?

    <a href="/login">

      Login

    </a>

  </div>

</div>

</body>

</html>
