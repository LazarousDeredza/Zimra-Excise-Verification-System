

<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>ZIMRA | Create Account</title>


  <style>

    * {
        box-sizing: border-box;
    }


    body {

        margin: 0;

        font-family: Arial, sans-serif;

        min-height: 100vh;

        background: #f4f6f8;

    }


    /* =========================================
       MAIN SPLIT SCREEN
    ========================================== */

    .signup-page {

        min-height: 100vh;

        display: flex;

    }


    /* =========================================
       LEFT SIDE - ZIMRA
    ========================================== */

    .logo-section {

        width: 50%;

        min-height: 100vh;

        background: #ffffff;

        display: flex;

        align-items: center;

        justify-content: center;

        position: relative;

        overflow: hidden;

    }


    .logo-content {

        text-align: center;

        width: 80%;

    }


    .logo-content img {

        width: 70%;

        max-width: 500px;

        height: auto;

        object-fit: contain;

    }


    .logo-content h1 {

        margin-top: 25px;

        margin-bottom: 10px;

        font-size: 30px;

        color: #1d3557;

    }


    .logo-content p {

        color: #6c757d;

        font-size: 15px;

    }


    /* =========================================
       RIGHT SIDE
    ========================================== */

    .form-section {

        width: 50%;

        min-height: 100vh;

        background: #f4f6f8;

        display: flex;

        align-items: center;

        justify-content: center;

        padding: 40px;

    }


    /* =========================================
       SIGNUP CARD
    ========================================== */

    .signup-container {

        width: 100%;

        max-width: 430px;

        background: white;

        padding: 40px;

        border-radius: 12px;

        box-shadow:
            0 10px 35px rgba(0, 0, 0, 0.08);

    }


    .signup-header {

        margin-bottom: 30px;

    }


    .signup-header h2 {

        margin: 0 0 8px;

        font-size: 30px;

        color: #212529;

    }


    .signup-header p {

        margin: 0;

        color: #6c757d;

        font-size: 14px;

    }


    /* =========================================
       FORM
    ========================================== */

    .form-group {

        margin-bottom: 18px;

    }


    label {

        display: block;

        margin-bottom: 8px;

        font-size: 14px;

        font-weight: 600;

        color: #343a40;

    }


    input {

        width: 100%;

        padding: 13px 14px;

        border: 1px solid #ced4da;

        border-radius: 7px;

        font-size: 14px;

        outline: none;

        transition: 0.2s;

    }


    input:focus {

        border-color: #198754;

        box-shadow:
            0 0 0 3px rgba(25, 135, 84, 0.1);

    }


    /* =========================================
       CREATE ACCOUNT BUTTON
    ========================================== */

    button {

        width: 100%;

        padding: 13px;

        background: #198754;

        color: white;

        border: none;

        cursor: pointer;

        border-radius: 7px;

        font-size: 15px;

        font-weight: 600;

        transition: 0.2s;

    }


    button:hover {

        background: #157347;

    }


    /* =========================================
       ERROR MESSAGE
    ========================================== */

    .message {

        padding: 12px;

        margin-bottom: 20px;

        text-align: center;

        border-radius: 6px;

        font-size: 14px;

    }


    .error {

        background: #f8d7da;

        color: #842029;

    }


    /* =========================================
       LOGIN LINK
    ========================================== */

    .login {

        text-align: center;

        margin-top: 25px;

        color: #6c757d;

        font-size: 14px;

    }


    .login a {

        color: #198754;

        text-decoration: none;

        font-weight: 600;

    }


    .login a:hover {

        text-decoration: underline;

    }


    /* =========================================
       MOBILE
    ========================================== */

    @media (max-width: 768px) {

        .signup-page {

            flex-direction: column;

        }


        .logo-section {

            width: 100%;

            min-height: 35vh;

        }


        .logo-content img {

            width: 45%;

            max-width: 250px;

        }


        .logo-content h1 {

            font-size: 22px;

            margin-top: 10px;

        }


        .logo-content p {

            display: none;

        }


        .form-section {

            width: 100%;

            min-height: 65vh;

            padding: 25px;

        }


        .signup-container {

            padding: 30px 25px;

        }

    }

  </style>

</head>


<body>


<div class="signup-page">


  <!-- =========================================
       LEFT: ZIMRA LOGO
  ========================================== -->

  <section class="logo-section">

    <div class="logo-content">

      <img
              src="/zimra.jpg"
              alt="ZIMRA Logo">


      <h1>
        Zimbabwe Revenue Authority
      </h1>


      <p>
        Excise • Special Surtax Verification System
      </p>

    </div>

  </section>


  <!-- =========================================
       RIGHT: SIGN UP FORM
  ========================================== -->

  <section class="form-section">


    <div class="signup-container">


      <div class="signup-header">

        <h2>
          Create Account
        </h2>

        <p>
          Register as an officer to access the
          Surtax Verification System.
        </p>

      </div>


      <!-- =====================================
           REGISTRATION ERROR
      ====================================== -->

      <div
              th:if="${param.error}"
              class="message error">

        An account with this email already exists.

      </div>


      <!-- =====================================
           SIGNUP FORM
      ====================================== -->

      <form
              method="POST"
              action="/register">


        <!-- NAME -->

        <div class="form-group">

          <label for="name">

            Full Name

          </label>

          <input
                  type="text"
                  id="name"
                  name="name"
                  placeholder="Enter your full name"
                  autocomplete="name"
                  required>

        </div>


        <!-- EMAIL -->

        <div class="form-group">

          <label for="email">

            Email Address

          </label>

          <input
                  type="email"
                  id="email"
                  name="email"
                  placeholder="Enter your email"
                  autocomplete="email"
                  required>

        </div>


        <!-- PASSWORD -->

        <div class="form-group">

          <label for="password">

            Password

          </label>

          <input
                  type="password"
                  id="password"
                  name="password"
                  placeholder="Create a password"
                  minlength="6"
                  autocomplete="new-password"
                  required>

        </div>


        <!-- CONFIRM PASSWORD -->

        <div class="form-group">

          <label for="confirmPassword">

            Confirm Password

          </label>

          <input
                  type="password"
                  id="confirmPassword"
                  name="confirmPassword"
                  placeholder="Confirm your password"
                  minlength="6"
                  autocomplete="new-password"
                  required>

        </div>


        <button type="submit">

          Create Account

        </button>


      </form>


      <!-- LOGIN -->

      <div class="login">

        Already have an account?

        <a href="/login">

          Login

        </a>

      </div>


    </div>


  </section>


</div>


<script>

  const form =
      document.querySelector("form");

  form.addEventListener("submit", function(event) {

      const password =
          document.getElementById("password").value;

      const confirmPassword =
          document.getElementById("confirmPassword").value;


      if (password !== confirmPassword) {

          event.preventDefault();

          alert("Passwords do not match.");

      }

  });

</script>


</body>

</html>
